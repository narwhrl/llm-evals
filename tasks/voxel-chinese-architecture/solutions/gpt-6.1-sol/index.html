<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8efee" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23a63f35'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' fill='white'%3E青%3C/text%3E%3C/svg%3E" />
    <title>青岚寺 · Qinglan Temple</title>
  </head>
  <body>
    <main id="scene" aria-label="青岚寺体素建筑群"></main>
    <header class="masthead">
      <div class="identity"><span class="seal" aria-hidden="true">青<br />岚</span><div><p class="eyebrow">山静 · 云闲</p><h1>青岚寺</h1><p class="english-name">QINGLAN TEMPLE</p></div></div>
      <div class="edition"><span>建筑山水</span><span class="edition-line"></span><span>〇一</span></div>
    </header>
    <aside class="view-controls" aria-label="场景视角">
      <button class="icon-button" id="home" aria-label="恢复全景" title="恢复全景"><i data-lucide="scan"></i></button>
      <button class="icon-button" id="top" aria-label="俯视院落" title="俯视院落"><i data-lucide="map"></i></button>
      <span class="divider"></span>
      <button class="icon-button" id="rotate" aria-label="自动环绕" title="自动环绕" aria-pressed="false"><i data-lucide="orbit"></i></button>
      <button class="icon-button" id="light" aria-label="切换暮色" title="切换暮色" aria-pressed="false"><i data-lucide="sun"></i></button>
    </aside>
    <footer class="colophon"><span class="scene-name">一方庭院，七座殿宇。</span><span class="coordinates">山门 <span>·</span> 钟鼓 <span>·</span> 大殿</span><span class="stamp">VOXEL STUDIES <b>01 / 07</b></span></footer>
    <div id="loading" role="status">青岚寺</div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
