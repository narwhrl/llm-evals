<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游戏房二十年 · Gaming Room Timeline</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14100d;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #e8ded2;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    .panel {
      position: absolute;
      background: rgba(24, 20, 16, 0.82);
      border: 1px solid rgba(255, 220, 170, 0.16);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    }

    #hud {
      left: 14px;
      top: 14px;
      padding: 10px 14px;
      min-width: 250px;
    }
    #hud .title { font-size: 13px; letter-spacing: 0.08em; opacity: 0.75; }
    #hud .year {
      font-size: 30px;
      font-weight: 700;
      color: #ffcf8f;
      line-height: 1.15;
    }
    #hud .phase { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    #hud .hint { font-size: 11px; opacity: 0.55; margin-top: 6px; }

    #timeline {
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: min(720px, 86vw);
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #playBtn {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 220, 170, 0.35);
      background: rgba(255, 190, 110, 0.12);
      color: #ffcf8f;
      font-size: 14px;
      cursor: pointer;
    }
    #playBtn:hover { background: rgba(255, 190, 110, 0.25); }
    #sliderWrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    #yearSlider {
      width: 100%;
      accent-color: #ffb45e;
      cursor: pointer;
    }
    #marks {
      position: relative;
      height: 14px;
      font-size: 10px;
      opacity: 0.7;
    }
    #marks span {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
      cursor: pointer;
    }
    #marks span:hover { color: #ffcf8f; opacity: 1; }
    #marks span::before {
      content: "";
      display: block;
      width: 1px;
      height: 4px;
      background: rgba(255, 220, 170, 0.5);
      margin: 0 auto 1px;
    }

    #info {
      right: 14px;
      top: 14px;
      width: 280px;
      max-height: 60vh;
      overflow: auto;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.55;
      display: none;
    }
    #info h3 { margin: 0 0 6px; font-size: 13px; color: #ffcf8f; }
    #info .era { opacity: 0.6; font-size: 11px; margin-bottom: 6px; }
    #info .mem {
      margin-top: 8px;
      padding: 8px;
      border-left: 2px solid #ffb45e;
      background: rgba(255, 180, 94, 0.07);
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }

    #screenOverlay {
      position: absolute;
      display: none;
      overflow: hidden;
      pointer-events: auto;
      background: #000;
    }
    #screenOverlay svg { display: block; width: 100%; height: 100%; }
    #screenOverlay text { pointer-events: none; user-select: none; }

    #toast {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      padding: 8px 18px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="panel">
    <div class="title">同一间房 · 二十年游戏时光</div>
    <div class="year" id="yearLabel">2005</div>
    <div class="phase" id="phaseLabel"></div>
    <div class="hint">拖动旋转 · 滚轮缩放 · 点击物品看记忆 · 点击屏幕进入桌面</div>
  </div>

  <div id="timeline" class="panel">
    <button id="playBtn" title="自动播放">▶</button>
    <div id="sliderWrap">
      <input id="yearSlider" type="range" min="2005" max="2025" step="0.05" value="2005" />
      <div id="marks"></div>
    </div>
  </div>

  <div id="info" class="panel"></div>

  <div id="screenOverlay"></div>

  <div id="toast" class="panel"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
