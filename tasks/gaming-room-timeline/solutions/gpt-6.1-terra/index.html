<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <title>Room Timeline · 2005—2025</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interactive 3D gaming room timeline"></canvas>
      <section class="hud" aria-label="Timeline controls">
        <div class="brand"><span class="eyebrow">ROOM 14B · PERSONAL ARCHIVE</span><h1>Twenty years<br><em>at the desk.</em></h1><p class="lede">A lived-in gaming room, remembered one upgrade at a time.</p></div>
        <div class="timeline-card">
          <div class="timeline-head"><div><span class="eyebrow">THE TIMELINE</span><div class="year-readout"><span id="year">2005</span><span class="slash">/</span><span class="year-end">2025</span></div></div><button id="play" class="play" type="button" aria-label="Play timeline">▶ <span>Play</span></button></div>
          <input id="timeline" type="range" min="2005" max="2025" value="2005" step="0.1" aria-label="Year" />
          <div class="ticks"><span>CRT glow</span><span>dual screens</span><span>the room grows</span><span>now</span></div>
        </div>
        <div class="hint"><span class="hint-dot"></span>Drag to orbit · scroll to move closer · click a keepsake</div>
      </section>
      <aside id="info" class="info-panel" aria-live="polite"><button id="close-info" aria-label="Close details">×</button><span id="info-tag" class="eyebrow">KEEPSAKE</span><h2 id="info-title">A small story</h2><p id="info-copy"></p><div id="info-meta" class="info-meta"></div></aside>
      <div class="screen-tip" id="screen-tip">Click the monitor to explore</div>
      <div class="crosshair" aria-hidden="true"><span></span></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
