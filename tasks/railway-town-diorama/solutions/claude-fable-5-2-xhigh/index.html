<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面微缩铁路小镇</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%238f5d36'/%3E%3Crect x='3' y='3' width='10' height='10' rx='1' fill='%237c9a4a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="微缩铁路小镇沙盘"></canvas>
    <div class="panel" role="group" aria-label="沙盘控制">
      <button id="toggle" type="button" aria-pressed="true">暂停</button>
      <label class="speed">
        <span>速度</span>
        <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1" />
        <output id="speedValue" for="speed">1.00×</output>
      </label>
      <button id="daynight" type="button" aria-pressed="false">夜晚</button>
      <button id="reset" type="button">复位</button>
      <span id="status" class="status" aria-live="polite">行驶中</span>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
