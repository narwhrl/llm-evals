<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暮色铁路小镇</title>
    <script type="module" crossorigin src="/llm-evals/railway-town-diorama/gpt-6.1-terra/assets/index-IUqbnaax.js"></script>
    <link rel="stylesheet" crossorigin href="/llm-evals/railway-town-diorama/gpt-6.1-terra/assets/index-mh0uiNvu.css">
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <aside class="hud">
        <div class="brand">
          <span class="eyebrow">HANDCRAFTED RAILWAY</span>
          <h1>暮色铁路小镇</h1>
          <p>沿河而建的桌面微缩沙盘</p>
        </div>
        <div class="controls">
          <div class="control-row">
            <button id="runToggle" class="primary">暂停列车</button>
            <button id="reset">复位</button>
            <button id="timeToggle">切换白天</button>
          </div>
          <label class="slider-label" for="speed">列车速度 <span id="speedValue">1.0×</span></label>
          <input id="speed" type="range" min="0.25" max="2.5" value="1" step="0.05" />
        </div>
        <div class="legend">
          <span><i class="dot train-dot"></i>列车运行中</span>
          <span><i class="dot water-dot"></i>白杨河</span>
          <span><i class="dot light-dot"></i>站台与路灯</span>
        </div>
        <div class="hint">拖动旋转 · 滚轮缩放</div>
      </aside>
      <div id="stationNotice" class="station-notice">列车即将进站</div>
      <div class="vignette"></div>
    </div>
  </body>
</html>
