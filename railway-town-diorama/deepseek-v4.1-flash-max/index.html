<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d5c7b2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324312b'/%3E%3Cpath d='M8 21 14 9l2.2 6L18.5 9 24 21' fill='none' stroke='%23e8b866' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Willow Creek, a working tabletop railway diorama built with Three.js."
    />
    <title>Willow Creek — Tabletop Railway</title>
    <script type="module" crossorigin src="/llm-evals/railway-town-diorama/deepseek-v4.1-flash-max/assets/index-BPFIuPgn.js"></script>
    <link rel="stylesheet" crossorigin href="/llm-evals/railway-town-diorama/deepseek-v4.1-flash-max/assets/index-Du7SRT7h.css">
  </head>
  <body data-theme="dusk">
    <main id="app">
      <canvas
        id="scene"
        aria-label="Interactive three-dimensional model of a railway town at dusk"
      ></canvas>

      <header class="brand" aria-label="Willow Creek model railway">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="15.5" fill="none" stroke="currentColor" />
          <path d="M9 21.5 14.7 9l3.1 8.2L20.8 9 25 21.5" fill="none" stroke="currentColor" />
          <path d="M7.5 24.5h19" stroke="currentColor" />
        </svg>
        <div>
          <h1>Willow Creek</h1>
          <p>Tabletop railway · 1:87</p>
        </div>
      </header>

      <button
        id="lighting-toggle"
        class="mode-toggle"
        type="button"
        aria-label="Switch to night lighting"
        aria-pressed="false"
      >
        <span class="mode-icon" aria-hidden="true">
          <svg class="sun-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24">
            <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
          </svg>
        </span>
        <span id="lighting-label">Dusk</span>
      </button>

      <div id="loading-screen" class="loading-screen" aria-live="polite">
        <div class="loading-emblem" aria-hidden="true">
          <span></span>
        </div>
        <p>Preparing Willow Creek</p>
      </div>

      <div id="service-status" class="service-status" role="status" aria-live="polite">
        <span class="service-light" aria-hidden="true"></span>
        <span id="service-label">Departing Willow Creek</span>
      </div>

      <section class="control-dock" aria-label="Railway controls">
        <button
          id="play-toggle"
          class="play-button"
          type="button"
          aria-label="Pause train"
          aria-pressed="false"
        >
          <svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6v12M16 6v12"></path>
          </svg>
          <svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 6 9 6-9 6Z"></path>
          </svg>
        </button>

        <div class="control-divider" aria-hidden="true"></div>

        <label class="speed-control" for="speed">
          <span class="control-heading">Speed</span>
          <span class="speed-row">
            <input
              id="speed"
              type="range"
              min="0.5"
              max="2"
              step="0.1"
              value="1"
              aria-label="Train speed"
            />
            <output id="speed-value" for="speed">1.0×</output>
          </span>
        </label>

        <div class="control-divider" aria-hidden="true"></div>

        <button id="reset" class="reset-button" type="button" aria-label="Reset the railway">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 9A8 8 0 1 1 4 14.4M4.5 9V4.5M4.5 9H9"></path>
          </svg>
          <span>Reset</span>
        </button>
      </section>

      <p class="camera-hint">Drag to orbit <span>·</span> Scroll to zoom</p>
    </main>

  </body>
</html>
