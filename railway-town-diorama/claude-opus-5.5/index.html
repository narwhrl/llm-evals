<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>柳河铁路小镇</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="/llm-evals/railway-town-diorama/claude-opus-5.5/assets/index-CmrOfjQr.js"></script>
    <link rel="stylesheet" crossorigin href="/llm-evals/railway-town-diorama/claude-opus-5.5/assets/index-BD5ZDt0H.css">
  </head>
  <body>
    <canvas id="scene" aria-label="桌面微缩铁路小镇三维沙盘"></canvas>
    <div class="loading" id="loading">正在搭建沙盘…</div>
    <aside class="panel" aria-label="控制">
      <header>
        <h1>柳河铁路小镇</h1>
        <p id="status" role="status" aria-live="polite">行驶中</p>
      </header>
      <div class="row">
        <button id="toggle" type="button" aria-pressed="false" aria-keyshortcuts="Space">暂停</button>
        <button id="reset" type="button" aria-keyshortcuts="R">复位</button>
      </div>
      <div class="speed">
        <label for="speed">速度</label>
        <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1" />
        <output id="speedValue" for="speed">1.00×</output>
      </div>
      <div class="segmented" role="group" aria-label="时段">
        <button type="button" data-night="0" aria-pressed="true">傍晚</button>
        <button type="button" data-night="1" aria-pressed="false" aria-keyshortcuts="N">夜晚</button>
      </div>
    </aside>
    <p class="hint">拖动旋转 · 滚轮缩放 · 右键平移</p>
  </body>
</html>
