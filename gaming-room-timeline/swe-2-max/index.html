en}#screenOverlay svg{width:100%;height:100%;display:block}#screenOverlay text{pointer-events:none;-webkit-user-select:none;user-select:none}#toast{padding:8px 18px;font-size:13px;display:none;position:absolute;top:18%;left:50%;transform:translate(-50%)}</style>
